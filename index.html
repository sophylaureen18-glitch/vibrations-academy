<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibrations – German Electronic Solutions &amp; Academy</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B0E11}
a{color:#F2F4F5;text-decoration:none}
.va-stage{height:100vh;height:100svh;min-height:480px;position:relative;overflow:hidden;background:#0B0E11 url(assets/frau.jpg) 34% 45%/cover no-repeat;color:#F2F4F5;font-family:Inter,system-ui,sans-serif}
.va-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:34% 45%;display:block}
#intro{transition:opacity .8s ease-in-out}

/* Kopfzeile */
.va-head{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;padding:18px 28px;background:linear-gradient(180deg,rgba(6,9,18,.6) 0%,rgba(6,9,18,0) 100%)}
.va-brand{order:1;display:flex;align-items:center;gap:12px;flex:none}
.va-brand img{width:44px;height:44px;object-fit:contain;display:block}
.va-brand span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.08em}
.va-navwrap{order:2;margin-left:auto;position:relative;flex:none}
.va-burger{order:3}

/* Menüleiste (Laptop) */
.va-nav{position:relative;display:flex;padding:4px;background:rgba(6,10,22,.6);border:1px solid rgba(127,168,255,.22);border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:14px;font-weight:600}
.va-nav a{padding:7px 11px;border-radius:999px;white-space:nowrap;transition:background .2s}
.va-nav a span{background:linear-gradient(180deg,#FFFFFF 0%,#D9E2EE 48%,#8EB1FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.va-nav a:hover{background:rgba(127,168,255,.14)}
.va-nav a[aria-current="page"]{background:rgba(79,123,255,.2);box-shadow:inset 0 0 0 1px rgba(142,177,255,.65)}

/* Menüknopf */
.va-burger{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(127,168,255,.35);background:rgba(6,10,22,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#DCE6F5;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.va-burger:hover,.va-burger[aria-expanded="true"]{border-color:rgba(142,177,255,.85);box-shadow:0 0 14px rgba(79,123,255,.45)}
.va-burger:focus-visible{outline:2px solid #8EB1FF;outline-offset:2px}
.va-burger .x{display:none}.va-burger[aria-expanded="true"] .x{display:block}.va-burger[aria-expanded="true"] .l{display:none}

/* Aufklapp-Menü */
.va-panel{position:absolute;z-index:20;top:76px;right:28px;width:min(300px,calc(100vw - 32px));padding:10px;border-radius:18px;background:rgba(6,10,22,.86);border:1px solid rgba(127,168,255,.25);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transform:translateY(-8px);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s;font-family:Inter,system-ui,sans-serif}
.va-panel.open{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.va-panel nav{position:relative;display:flex;flex-direction:column}
.va-panel nav a{padding:11px 14px;border-radius:10px;font-size:18px;font-weight:600;line-height:1.2}
.va-panel nav a span{background:linear-gradient(180deg,#EEF2F7 0%,#AFBACA 42%,#4F78EC 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.va-panel nav a:hover,.va-panel nav a:focus-visible{background:rgba(79,123,255,.14);outline:none}
.va-panel nav a[aria-current="page"]{background:rgba(79,123,255,.18);box-shadow:inset 0 0 0 1px rgba(142,177,255,.55)}
.va-panel .small{display:flex;gap:18px;padding:12px 14px 6px;margin-top:6px;border-top:1px solid rgba(127,168,255,.18);font-size:13px}
.va-panel .small a{color:#AFBACA}

/* Lichtpartikel-Rand */
.va-spark{position:absolute;left:-14px;top:-14px;pointer-events:none;z-index:2}
.va-nav>a,.va-panel nav,.va-panel .small{position:relative;z-index:1}

.va-legal{position:absolute;right:28px;bottom:16px;display:flex;gap:18px;font-size:12px;z-index:5}
.va-legal a{color:#C9D0D6}

/* Handy, Tablet, kleine Laptops: Menüpunkte als Liste rechts, Menüknopf links */
@media (max-width:1300px){
  .va-head{padding:14px 16px;gap:12px;align-items:flex-start}
  .va-burger{order:0}
  .va-nav{flex-direction:column;align-items:stretch;border-radius:18px}
  .va-nav a{text-align:right;padding:6px 13px}
  .va-nav a span{background-image:linear-gradient(180deg,#EEF2F7 0%,#AFBACA 42%,#5B82F0 100%)}
  .va-panel{left:16px;right:auto;top:72px}
}
@media (max-width:600px){
  .va-brand span{display:none}
  .va-nav{font-size:13px}
  .va-nav a{padding:5px 11px}
}
@media (prefers-reduced-motion:reduce){ #intro,.va-panel{transition:none} }
</style>
</head>
<body>
<main class="va-stage">
  <video id="loop" class="va-media" data-src="assets/frau-loop.mp4" poster="assets/frau-loop.jpg" muted loop playsinline preload="none" aria-hidden="true"></video>
  <video id="intro" class="va-media" data-src="assets/frau-intro.mp4" poster="assets/frau-intro.jpg" muted playsinline preload="none" aria-label="Animierte Illustration: Cyborg-Frau im Wasser hebt den Kopf und blickt nach oben"></video>

  <header class="va-head">
    <button class="va-burger" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="va-panel">
      <svg class="l" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="x" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <a class="va-brand" href="index.html">
      <img src="assets/logo.png" alt="Vibrations Academy Logo">
      <span>VIBRATIONS</span>
    </a>
    <div class="va-navwrap">
      <canvas class="va-spark" aria-hidden="true"></canvas>
      <nav class="va-nav" aria-label="Hauptnavigation">
        <a href="index.html" aria-current="page"><span>Startseite</span></a>
        <a href="academy.html"><span>Academy</span></a>
        <a href="solutions.html"><span>Electronic Solutions</span></a>
        <a href="media.html"><span>Media Productions</span></a>
        <a href="fashion.html"><span>Vibrations Fashion</span></a>
        <a href="pruefdienste.html"><span>Prüfdienste – Services</span></a>
        <a href="referenzen.html"><span>Referenzen</span></a>
        <a href="kontakt.html"><span>Kontakt</span></a>
      </nav>
    </div>
  </header>

  <div id="va-panel" class="va-panel" aria-hidden="true">
    <canvas class="va-spark" aria-hidden="true"></canvas>
    <nav aria-label="Menü">
      <a href="index.html" aria-current="page"><span>Startseite</span></a>
      <a href="academy.html"><span>Academy</span></a>
      <a href="solutions.html"><span>Electronic Solutions</span></a>
      <a href="media.html"><span>Media Productions</span></a>
      <a href="fashion.html"><span>Vibrations Fashion</span></a>
      <a href="pruefdienste.html"><span>Prüfdienste – Services</span></a>
      <a href="referenzen.html"><span>Referenzen</span></a>
      <a href="kontakt.html"><span>Kontakt</span></a>
    </nav>
    <div class="small">
      <a href="https://vibrations-academy.com/impressum">Impressum</a>
      <a href="https://vibrations-academy.com/datenschutz">Datenschutz</a>
    </div>
  </div>

  <div class="va-legal">
    <a href="https://vibrations-academy.com/impressum">Impressum</a>
    <a href="https://vibrations-academy.com/datenschutz">Datenschutz</a>
  </div>
</main>

<script>
(function(){
  var stage=document.querySelector('.va-stage');
  var intro=document.getElementById('intro'), loop=document.getElementById('loop'), started=false;

  /* Frau bei jeder Bildschirmgröße gut sichtbar: auf schmalen Bildschirmen mittig-links, rechts ist Platz für die Menüliste */
  var WOMAN_X=0.335, TARGET=0.37, VIDEO_RATIO=16/9;
  function frameWoman(){
    var f=(stage.clientWidth/stage.clientHeight)/VIDEO_RATIO, p=34;
    if(f<0.8){ p=Math.max(0,Math.min(100,(WOMAN_X-TARGET*f)/(1-f)*100)); }
    var pos=p.toFixed(1)+'% 45%';
    intro.style.objectPosition=pos; loop.style.objectPosition=pos; stage.style.backgroundPosition=pos;
  }
  frameWoman(); window.addEventListener('resize', frameWoman);

  /* Videos: erst komplett laden, dann flüssig abspielen */
  function hideIntro(){ intro.style.opacity='0'; }
  intro.addEventListener('ended', function(){
    if(started) return; started=true;
    try{ loop.currentTime=0; var p=loop.play(); if(p&&p.catch) p.catch(hideIntro); }catch(e){ hideIntro(); }
  });
  loop.addEventListener('playing', function(){ if(started) hideIntro(); });
  function load(v){ return fetch(v.dataset.src).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(b){ v.src=URL.createObjectURL(b); }); }
  Promise.all([load(intro), load(loop)]).then(function(){
    loop.load(); var p=intro.play(); if(p&&p.catch) p.catch(function(){});
  }).catch(function(){});

  /* Elektrischer Rand: weiche Blitzbögen, die langsam am Rand entlangziehen */
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS=[[142,177,255],[79,123,255],[166,140,255],[92,210,255],[230,140,255]];
  function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

  function Sparks(canvas, host, opts){
    this.c=canvas; this.host=host; this.o=opts; this.ctx=canvas.getContext('2d'); this.pts=[]; this.nrm=[]; this.bolts=[]; this.pad=14; this.L=0;
  }
  Sparks.prototype.resize=function(){
    var w=this.host.offsetWidth, h=this.host.offsetHeight; if(!w||!h){ this.L=0; return; }
    var dpr=Math.min(window.devicePixelRatio||1,2), pad=this.pad;
    this.W=w+pad*2; this.H=h+pad*2;
    this.c.style.left=this.c.style.top=(-pad)+'px';
    this.c.width=Math.round(this.W*dpr); this.c.height=Math.round(this.H*dpr); this.c.style.width=this.W+'px'; this.c.style.height=this.H+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    var r=Math.min(this.o.radius==='pill'?(h>60?18:h/2):this.o.radius,h/2,w/2), x0=pad, y0=pad, pts=[], step=2;
    function line(ax,ay,bx,by){ var d=Math.hypot(bx-ax,by-ay), n=Math.max(1,Math.round(d/step)); for(var i=0;i<n;i++) pts.push([ax+(bx-ax)*i/n, ay+(by-ay)*i/n]); }
    function arc(cx,cy,a0){ var n=Math.max(2,Math.round(r*Math.PI/2/step)); for(var i=0;i<n;i++){ var a=a0+Math.PI/2*i/n; pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); } }
    line(x0+r,y0,x0+w-r,y0); arc(x0+w-r,y0+r,-Math.PI/2);
    line(x0+w,y0+r,x0+w,y0+h-r); arc(x0+w-r,y0+h-r,0);
    line(x0+w-r,y0+h,x0+r,y0+h); arc(x0+r,y0+h-r,Math.PI/2);
    line(x0,y0+h-r,x0,y0+r); arc(x0+r,y0+r,Math.PI);
    var L=pts.length, nrm=[];
    for(var i=0;i<L;i++){ var a=pts[(i-2+L)%L], b=pts[(i+2)%L], dx=b[0]-a[0], dy=b[1]-a[1], d=Math.hypot(dx,dy)||1; nrm.push([dy/d,-dx/d]); }
    this.pts=pts; this.nrm=nrm; this.L=L;
    if(!this.bolts.length){ for(var k=0;k<this.o.bolts;k++) this.bolts.push(this.spawn(true)); }
    this.draw(performance.now()/1000);
  };
  Sparks.prototype.spawn=function(first){
    return { s:Math.random()*this.L, v:(0.12+Math.random()*0.22)*(Math.random()<.5?-1:1), len:Math.round(35+Math.random()*55),
             amp:3+Math.random()*4, c:COLORS[Math.floor(Math.random()*COLORS.length)], ph:[Math.random()*9,Math.random()*9,Math.random()*9],
             age:first?Math.random()*3:0, life:3+Math.random()*3, fork:Math.random()<.6?0.25+Math.random()*0.5:-1 };
  };
  Sparks.prototype.path=function(b,t,from,to,extra){
    var L=this.L, out=[];
    for(var j=from;j<=to;j+=2){
      var k=Math.floor(b.s+j), i=((k%L)+L)%L, p=this.pts[i], n=this.nrm[i];
      var u=j/b.len, env=Math.sin(Math.PI*Math.min(1,Math.max(0,u)));
      var o=b.amp*env*(0.6*Math.sin(j*0.28+t*1.1+b.ph[0])+0.3*Math.sin(j*0.75-t*1.7+b.ph[1])+0.15*Math.sin(j*1.9+t*2.6+b.ph[2]));
      if(extra) o+=extra(j);
      out.push([p[0]+n[0]*o, p[1]+n[1]*o]);
    }
    return out;
  };
  function smooth(g,q){
    g.beginPath(); g.moveTo(q[0][0],q[0][1]);
    for(var i=1;i<q.length-1;i++){ var mx=(q[i][0]+q[i+1][0])/2, my=(q[i][1]+q[i+1][1])/2; g.quadraticCurveTo(q[i][0],q[i][1],mx,my); }
    var e=q[q.length-1]; g.lineTo(e[0],e[1]);
  }
  Sparks.prototype.stroke=function(g,q,c,a){
    if(q.length<2) return;
    smooth(g,q);
    g.strokeStyle=rgba(c,.12*a); g.lineWidth=7; g.stroke();
    g.strokeStyle=rgba(c,.35*a); g.lineWidth=3; g.stroke();
    g.strokeStyle='rgba(240,246,255,'+(.9*a)+')'; g.lineWidth=1.1; g.stroke();
  };
  /* Durchgehender Blitz rund um den ganzen Rand, Farben wandern langsam durch */
  var ELEC=[[0,229,255],[61,123,255],[138,92,255],[255,61,203],[57,255,136],[255,176,0]];
  function mix(t){ t=((t%1)+1)%1; var n=ELEC.length, x=t*n, i=Math.floor(x), f=x-i, a=ELEC[i%n], b=ELEC[(i+1)%n];
    return [Math.round(a[0]+(b[0]-a[0])*f), Math.round(a[1]+(b[1]-a[1])*f), Math.round(a[2]+(b[2]-a[2])*f)]; }
  Sparks.prototype.draw=function(t){
    var g=this.ctx, L=this.L, pts=this.pts, nrm=this.nrm; if(!L) return;
    g.clearRect(0,0,this.W,this.H);
    g.globalCompositeOperation='lighter'; g.lineCap='round'; g.lineJoin='round';
    var TAU=Math.PI*2, m1=Math.max(3,Math.round(L/50)), m2=Math.max(7,Math.round(L/17)), m3=Math.max(15,Math.round(L/7));
    var strands=[{amp:2.6,ph:0,a:1},{amp:3.4,ph:2.1,a:.45}], SEG=12;
    for(var sI=0;sI<strands.length;sI++){
      var st=strands[sI], q=new Array(L+1);
      for(var i=0;i<=L;i++){
        var k=i%L, u=k/L;
        var o=st.amp*(0.55*Math.sin(TAU*m1*u+t*0.7+st.ph)+0.3*Math.sin(TAU*m2*u-t*1.3+st.ph*1.7)+0.15*Math.sin(TAU*m3*u+t*2.1+st.ph*2.3));
        q[i]=[pts[k][0]+nrm[k][0]*o, pts[k][1]+nrm[k][1]*o];
      }
      for(var j=0;j<L;j+=SEG){
        var e=Math.min(L,j+SEG), c=mix(j/L+t*0.04+sI*0.18);
        var pulse=0.65+0.35*Math.sin(TAU*2*(j/L)-t*0.8+st.ph);
        g.beginPath(); g.moveTo(q[j][0],q[j][1]); for(var z=j+1;z<=e;z++) g.lineTo(q[z][0],q[z][1]);
        g.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(0.14*pulse*st.a)+')'; g.lineWidth=4; g.stroke();
        g.strokeStyle='rgba('+Math.round((c[0]+255)/2)+','+Math.round((c[1]+255)/2)+','+Math.round((c[2]+255)/2)+','+(0.85*pulse*st.a)+')'; g.lineWidth=1.2; g.stroke();
      }
    }
    g.globalCompositeOperation='source-over';
  };

  var panel=document.getElementById('va-panel');
  var navSparks=new Sparks(document.querySelector('.va-navwrap .va-spark'), document.querySelector('.va-nav'), {radius:'pill', bolts:6});
  var panelSparks=new Sparks(panel.querySelector('.va-spark'), panel, {radius:18, bolts:5});
  function resizeAll(){ navSparks.resize(); panelSparks.resize(); }
  if(window.ResizeObserver){ new ResizeObserver(function(){ navSparks.resize(); }).observe(navSparks.host); new ResizeObserver(function(){ panelSparks.resize(); }).observe(panel); }
  window.addEventListener('resize', resizeAll);
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(resizeAll);

  if(!reduce){
    var last=0;
    (function tick(t){
      requestAnimationFrame(tick);
      if(document.hidden) return; var sec=t/1000;
      if(navSparks.host.offsetWidth) navSparks.draw(sec);
      if(panel.classList.contains('open')) panelSparks.draw(sec);
    })(0);
  }

  /* Menüknopf */
  var btn=document.querySelector('.va-burger');
  function setOpen(o){
    panel.classList.toggle('open',o); panel.setAttribute('aria-hidden',o?'false':'true');
    btn.setAttribute('aria-expanded',o?'true':'false'); btn.setAttribute('aria-label',o?'Menü schließen':'Menü öffnen');
    if(o){ panelSparks.resize(); }
  }
  btn.addEventListener('click', function(e){ e.stopPropagation(); setOpen(!panel.classList.contains('open')); });
  document.addEventListener('click', function(e){ if(panel.classList.contains('open') && !panel.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && panel.classList.contains('open')){ setOpen(false); btn.focus(); } });
  var mq=window.matchMedia("(max-width:1300px)");
  if(mq.addEventListener) mq.addEventListener('change', function(){ setOpen(false); }); else mq.addListener(function(){ setOpen(false); });
})();
</script>
</body>
