<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibrations – German Electronic Solutions &amp; Academy</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E11}
a{color:#F2F4F5;text-decoration:none}a:hover{color:#FFFFFF}
.va-nav{gap:0!important;padding:4px;background:rgba(11,14,17,.55);border:1px solid rgba(255,255,255,.16);border-radius:24px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.va-nav a{padding:7px 10px;border-radius:999px;opacity:.85!important;white-space:nowrap;transition:background .2s,opacity .2s}
.va-nav a:hover{background:rgba(255,255,255,.1);opacity:1!important;color:#FFFFFF}
.va-nav a[aria-current="page"]{background:rgba(242,108,12,.16);box-shadow:inset 0 0 0 1px rgba(245,160,0,.6);opacity:1!important}
.va-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:34% 45%;display:block}
@media (max-width: 1100px){
  .va-head{align-items:flex-start!important;flex-wrap:nowrap!important}
  .va-nav{flex-direction:column;flex-wrap:nowrap!important;align-items:stretch;border-radius:18px;margin-left:auto}
  .va-nav a{text-align:right;padding:6px 14px}
}
@media (max-width: 600px){
  .va-head{padding:14px 14px!important;gap:12px!important}
  .va-brand span{display:none}
  .va-media{object-position:38% 45%}
  main{background-position:38% 45%!important}
  .va-nav{font-size:13px!important;padding:3px}
  .va-nav a{padding:5px 12px}
}
#intro{transition:opacity .8s ease-in-out}
@media (prefers-reduced-motion: reduce){#intro{transition:none}}
</style>
</head>
<body>
<main style="height: 100vh; min-height: 520px; position: relative; overflow: hidden; background: #0B0E11 url(assets/frau.jpg) 34% 45% / cover no-repeat; color: #F2F4F5; font-family: Inter, system-ui, sans-serif">
  <video id="loop" class="va-media" data-src="assets/frau-loop.mp4" poster="assets/frau-loop.jpg" muted loop playsinline preload="none" aria-hidden="true"></video>
  <video id="intro" class="va-media" data-src="assets/frau-intro.mp4" poster="assets/frau-intro.jpg" muted playsinline preload="none" aria-label="Animierte Illustration: Cyborg-Frau im Wasser hebt den Kopf und blickt nach oben"></video>

  <header class="va-head" style="position: absolute; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 18px 32px; background: linear-gradient(180deg, rgba(11,14,17,.55) 0%, rgba(11,14,17,0) 100%)">
    <a class="va-brand" href="index.html" style="display: flex; align-items: center; gap: 12px">
      <img src="assets/logo.png" alt="Vibrations Academy Logo" style="width: 44px; height: 44px; object-fit: contain">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .08em">VIBRATIONS</span>
    </a>
    <nav class="va-nav" aria-label="Hauptnavigation" style="display: flex; flex-wrap: wrap; margin-left: auto; font-size: 14px; font-weight: 500">
      <a href="index.html" aria-current="page">Startseite</a>
      <a href="academy.html">Academy</a>
      <a href="solutions.html">Electronic Solutions</a>
      <a href="media.html">Media Productions</a>
      <a href="fashion.html">Vibrations Fashion</a>
      <a href="pruefdienste.html">Prüfdienste – Services</a>
      <a href="referenzen.html">Referenzen</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
  </header>

  <div style="position: absolute; right: 40px; bottom: 16px; display: flex; gap: 18px; font-size: 12px">
    <a href="https://vibrations-academy.com/impressum" style="color: #C9D0D6">Impressum</a>
    <a href="https://vibrations-academy.com/datenschutz" style="color: #C9D0D6">Datenschutz</a>
  </div>
</main>
<script>
(function(){
  var intro=document.getElementById('intro'), loop=document.getElementById('loop'), started=false;
  function hideIntro(){ intro.style.opacity='0'; }
  intro.addEventListener('ended', function(){
    if(started) return; started=true;
    try{ loop.currentTime=0; var p=loop.play(); if(p&&p.catch) p.catch(hideIntro); }catch(e){ hideIntro(); }
  });
  loop.addEventListener('playing', function(){ if(started) hideIntro(); });
  /* Beide Videos erst komplett laden, dann abspielen: kein Ruckeln bei langsamer Verbindung */
  function load(v){ return fetch(v.dataset.src).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(b){ v.src=URL.createObjectURL(b); }); }
  Promise.all([load(intro), load(loop)]).then(function(){
    loop.load();
    var p=intro.play(); if(p&&p.catch) p.catch(function(){});
  }).catch(function(){ /* ohne Videos bleibt das Standbild stehen */ });
})();
</script>
</body>
</html>
